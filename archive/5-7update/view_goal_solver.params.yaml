view_goal_solver:
  ros__parameters:
    # planning_group: MoveIt planning group name. Layer: input/model lookup. Changing it selects a different joint group and must match SRDF.
    planning_group: arm
    # base_frame: frame_id used for published joint candidate headers. Layer: publishing/debug. Change only if the robot base frame changes.
    base_frame: base_link
    # effector_frame: robot link used as FK endpoint before applying effector->camera TF. Layer: input geometry. Must be a RobotModel link.
    effector_frame: tcp_link
    # camera_frame: optical camera frame looked up from effector_frame. Layer: input geometry. Wrong value corrupts camera pose scoring.
    camera_frame: camera_color_optical_frame

    # cylinder_semantics_topic: JSON string topic containing top_center_base and axis_base. Layer: input. Remap if the perception bridge changes.
    cylinder_semantics_topic: /cylinder_semantics_base
    # target_id_topic: selected target id topic. Layer: input gating. Used only when require_target_id is true.
    target_id_topic: /target_id
    # joint_candidate_topic: JointTrajectory topic containing sorted feasible q candidates. Layer: publishing. Executor plans these in order.
    joint_candidate_topic: /view_goal_joint_candidates
    # joint_target_topic: legacy single JointState topic. Layer: optional legacy publishing. Default disabled by publish_legacy_joint_target.
    joint_target_topic: /view_goal_joint_target
    # debug_topic: JSON debug topic. Layer: diagnostics. Use it to inspect hard violations, quality score, and candidate count.
    debug_topic: /view_goal_solver_debug

    # require_target_id: if true, ignore measurements until /target_id arrives. Layer: input gating. Set false for bench tests without selector.
    require_target_id: true
    # solve_once_per_selection: if true, publish once per selected id. Layer: input gating. Set false for repeated solve/debug streaming.
    solve_once_per_selection: true

    # axis_into_tube_sign: fallback sign for axis direction when current camera side is unavailable. Layer: input interpretation. Usually 1.0.
    axis_into_tube_sign: 1.0
    # depth_proxy_m: meters from top center along view_axis for the gaze point. Layer: geometry metric. Larger aims deeper into the tube.
    depth_proxy_m: 0.055
    # standoff_desired_m: preferred axial camera distance from top center, meters. Layer: rank score. Must remain inside standoff_min_m/standoff_max_m.
    standoff_desired_m: 0.12
    # standoff_min_m: minimum camera axial distance from top center, meters. Layer: hard constraint. Larger rejects closer candidates.
    standoff_min_m: 0.06
    # standoff_max_m: maximum camera axial distance from top center, meters. Layer: hard constraint. Smaller rejects farther candidates.
    standoff_max_m: 0.15
    # lateral_max_m: maximum camera offset from tube axis, meters. Layer: hard constraint. Smaller demands more centered viewpoints.
    lateral_max_m: 0.005
    # gaze_max_rad: optional max angle from camera optical axis to depth proxy, radians. Layer: hard constraint when enforce_gaze_max is true.
    gaze_max_rad: 0.35
    # axis_max_rad: max angle between camera optical axis and tube view axis, radians. Layer: hard constraint. Smaller is stricter.
    axis_max_rad: 0.25
    # enforce_lateral_max: enable lateral_max_m as hard constraint. Layer: hard constraint. Disable only for diagnostics.
    enforce_lateral_max: true
    # enforce_gaze_max: enable gaze_max_rad as hard constraint. Layer: hard constraint. Default false because axis alignment is primary.
    enforce_gaze_max: false
    # enforce_axis_max: enable axis_max_rad as hard constraint. Layer: hard constraint. Disable only to inspect reachability.
    enforce_axis_max: true
    # constraint_tolerance_m: meter tolerance applied only to feasible checks. Layer: hard constraint gate. Larger accepts tiny distance violations.
    constraint_tolerance_m: 0.0005
    # constraint_tolerance_rad: radian tolerance applied only to feasible checks. Layer: hard constraint gate. Larger accepts tiny angle violations.
    constraint_tolerance_rad: 0.005

    # enable_feasibility_first: if true, infeasible search minimizes hard_violation_total before quality. Layer: feasibility search.
    enable_feasibility_first: true
    # feasibility_epsilon: numeric tolerance for hard violation comparisons. Layer: feasibility search. Larger ignores tiny changes.
    feasibility_epsilon: 1.0e-8
    # feasibility_tie_break_epsilon: hard-violation tie band where comfort breaks ties. Layer: feasibility search. Larger favors comfort sooner.
    feasibility_tie_break_epsilon: 1.0e-6
    # infeasible_comfort_weight: execution-proxy weight inside feasibility_merit for near-ties. Layer: feasibility search. Larger avoids aggressive joints before feasible.
    infeasible_comfort_weight: 0.08
    # infeasible_hard_progress_epsilon: required hard violation drop for immediate acceptance. Layer: feasibility search. Larger demands clearer progress.
    infeasible_hard_progress_epsilon: 1.0e-6

    # quality_weight_motion: weight for total normalized joint motion in execution_proxy_score. Layer: rank score. Larger prefers staying near q_start.
    quality_weight_motion: 2.0
    # quality_weight_wrist_motion: weight for last-three-joint motion in execution_proxy_score. Layer: rank score. Larger discourages wrist-heavy poses.
    quality_weight_wrist_motion: 0.1
    # quality_weight_joint_limit: weight for closeness to joint limits in execution_proxy_score. Layer: rank score. Larger prefers joint-limit margin.
    quality_weight_joint_limit: 3.0
    # quality_weight_axis_error: weight multiplied by axis_error^2, units 1/rad^2. Layer: rank score. Larger drives optical-axis error toward 0.
    quality_weight_axis_error: 10.0
    # quality_weight_lateral_error: weight multiplied by lateral_error^2, units 1/m^2. Layer: rank score. Larger drives camera offset from tube axis toward 0.
    quality_weight_lateral_error: 100000.0
    # quality_weight_standoff_target: weight multiplied by (axial_standoff - standoff_desired_m)^2, units 1/m^2. Layer: rank score. Larger favors target standoff.
    quality_weight_standoff_target: 1.0
    # joint_limit_margin_threshold_rad: radians defining "near joint limit" for quality cost. Layer: quality ranking. Larger starts penalizing earlier.
    joint_limit_margin_threshold_rad: 0.2

    # feasible_candidate_pool_size: max feasible candidates retained and published. Layer: publishing. Larger gives executor more plan fallback options.
    feasible_candidate_pool_size: 16
    # publish_joint_candidate_pool: publish sorted JointTrajectory candidates. Layer: publishing. Default true for executor-side planning fallback.
    publish_joint_candidate_pool: true
    # publish_legacy_joint_target: publish the old single JointState target. Layer: publishing. Default false to avoid mixed execution paths.
    publish_legacy_joint_target: false

    # multi_start_count: number of q-space seeds. Layer: feasibility search. Larger improves coverage but increases solve time.
    multi_start_count: 24
    # max_iterations_per_seed: coordinate-descent iteration cap per seed. Layer: feasibility search. Larger may improve convergence but costs time.
    max_iterations_per_seed: 300
    # initial_step_rad: initial per-joint coordinate step, radians. Layer: feasibility search. Larger explores faster but can jump over narrow basins.
    initial_step_rad: 0.14
    # min_step_rad: stop threshold for coordinate step, radians. Layer: feasibility search. Smaller refines more but costs time.
    min_step_rad: 0.0005
    # step_shrink: multiplier when no coordinate improves. Layer: feasibility search. Smaller shrinks faster; larger searches longer at each scale.
    step_shrink: 0.5
    # seed_perturbation_rad: deterministic perturbation size around current q, radians. Layer: feasibility search. Larger broadens seeds.
    seed_perturbation_rad: 0.35

    # current_state_wait_sec: seconds to wait for MoveIt current state. Layer: input. Larger tolerates slow joint state updates.
    current_state_wait_sec: 1.0
    # tf_lookup_timeout_sec: seconds to wait for effector->camera TF. Layer: input. Larger tolerates delayed TF.
    tf_lookup_timeout_sec: 0.5
    # allow_identity_effector_camera_fallback: use identity transform if TF is missing. Layer: input/debug. Keep false for real runs.
    allow_identity_effector_camera_fallback: false
    # publish_if_constraints_fail: legacy escape hatch for single JointState publishing only. Layer: publishing. Keep false for normal operation.
    publish_if_constraints_fail: false
